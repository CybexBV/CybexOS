[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "W", "UP"]
# Short statements share a line (`a = 1; b = 2`, `if x: return`) and small
# helpers are named lambdas throughout the code base: a style choice, not a fault.
# zip(strict=...) and legacy % formatting are left to callers' discretion.
ignore = ["E701", "E702", "E731", "B905", "UP031"]

[tool.ruff.lint.per-file-ignores]
# Tests put the source tree on sys.path before they import it, and define
# fixture callbacks inside loops.
"tests/**" = ["E402", "B023"]
